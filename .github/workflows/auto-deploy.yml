name: Auto-deploy to Vercel

on:
  push:
    branches:
      - 'claude/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Force-update Vercel production branch
        run: |
          SHA="${{ github.sha }}"
          PROD_BRANCH="claude/setup-repository-JswtN"

          BODY=$(curl -s -o /tmp/ref_response.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${PROD_BRANCH}" \
            -d "{\"sha\":\"$SHA\",\"force\":true}")

          echo "HTTP $BODY: $(cat /tmp/ref_response.json)"

          if [ "$BODY" = "200" ]; then
            echo "✅ ${PROD_BRANCH} updated to $SHA — Vercel deploying to production."
          else
            echo "❌ Failed with HTTP $BODY"
            exit 1
          fi
