name: Auto-deploy to Vercel

on:
  push:
    branches:
      - 'claude/**'

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge branch into main via GitHub API
        id: merge
        run: |
          BODY=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/merges" \
            -d "{\"base\":\"main\",\"head\":\"${{ github.ref_name }}\",\"commit_message\":\"chore: auto-deploy ${{ github.ref_name }}\"}" \
            -o /tmp/merge_response.json -w "%{http_code}")

          RESPONSE=$(cat /tmp/merge_response.json)
          echo "http_code=$BODY" >> $GITHUB_OUTPUT
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          echo "HTTP $BODY: $RESPONSE"

          if [ "$BODY" = "201" ] || [ "$BODY" = "204" ]; then
            echo "✅ Merge successful"
          else
            echo "error_msg=HTTP $BODY: $RESPONSE" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Post error as PR comment
        if: failure()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/3/comments" \
            -d "{\"body\":\"🔴 **auto-deploy debug** — HTTP ${{ steps.merge.outputs.http_code }}\\n\\n\`\`\`json\\n${{ steps.merge.outputs.response }}\\n\`\`\`\"}"
